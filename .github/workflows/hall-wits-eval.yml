name: Hall Wits — PR eval

on:
  issue_comment:
    types: [created]

jobs:
  gate:
    if: >
      github.event.issue.pull_request &&
      contains(fromJSON('["MEMBER","OWNER","COLLABORATOR"]'),
               github.event.comment.author_association)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      checks: write
    outputs:
      triggered: ${{ steps.trigger.outputs.triggered }}
      head-sha: ${{ steps.trigger.outputs.head-sha }}
      check-run-id: ${{ steps.trigger.outputs.check-run-id }}
    steps:
      - name: Start trigger + check run
        id: trigger
        uses: MockaSort-Studio/actions/.github/actions/pr-comment-trigger/start@b6c0f11851bc3df2a9bf7f9e3f335082c466874a
        with:
          check-name: hall-wits-eval
          trigger-phrase: ":crystal_ball:"
          in-progress-title: "Hall Wits eval running"
          in-progress-summary: "Provisioning, running the golden task, checking, and judging…"
          ack-comment: ":crystal_ball: Popotron stirs... running the golden task."
          token: ${{ secrets.GITHUB_TOKEN }}

  pipeline:
    needs: gate
    if: needs.gate.outputs.triggered == 'true'
    uses: ./.github/workflows/hall-wits-eval-core.yml
    with:
      plugin-sha: ${{ needs.gate.outputs.head-sha }}
    secrets: inherit

  finish:
    needs: [gate, pipeline]
    if: always() && needs.gate.outputs.triggered == 'true'
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
      checks: write
    steps:
      - name: Download report
        if: needs.pipeline.outputs.run-id != ''
        uses: actions/download-artifact@v4
        with:
          name: hall-wits-run-${{ needs.pipeline.outputs.run-id }}

      - name: Post assessment comment
        if: needs.pipeline.outputs.run-id != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh pr comment ${{ github.event.issue.number }} \
            --body-file report.md --repo "$GITHUB_REPOSITORY"

      - name: Finish trigger + check run
        if: always()
        uses: MockaSort-Studio/actions/.github/actions/pr-comment-trigger/finish@b6c0f11851bc3df2a9bf7f9e3f335082c466874a
        with:
          check-run-id: ${{ needs.gate.outputs.check-run-id }}
          status: ${{ needs.pipeline.result }}
          token: ${{ secrets.GITHUB_TOKEN }}
