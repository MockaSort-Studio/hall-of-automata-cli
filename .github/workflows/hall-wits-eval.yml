name: Hall Wits — PR eval

on:
  issue_comment:
    types: [created]

jobs:
  gate:
    if: >
      github.event.issue.pull_request &&
      contains(fromJSON('["MEMBER","OWNER","COLLABORATOR"]'),
               github.event.comment.author_association)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      checks: write
    outputs:
      triggered: ${{ steps.trigger.outputs.triggered }}
      head-sha: ${{ steps.trigger.outputs.head-sha }}
      check-run-id: ${{ steps.trigger.outputs.check-run-id }}
    steps:
      - name: Start trigger + check run
        id: trigger
        uses: MockaSort-Studio/actions/.github/actions/pr-comment-trigger/start@993d2dda1e172fa1f06a7d218f32c4bd66303fde
        with:
          check-name: hall-wits-eval
          trigger-phrase: ":crystal_ball:|🔮"
          in-progress-title: "Hall Wits eval running"
          in-progress-summary: "Provisioning, running the golden task, checking, and judging…"
          ack-comment: ":crystal_ball: Popotron stirs... running the golden task."
          token: ${{ secrets.GITHUB_TOKEN }}

  pipeline:
    needs: gate
    if: needs.gate.outputs.triggered == 'true'
    strategy:
      fail-fast: false
      matrix:
        iteration: [1, 2, 3]
    uses: ./.github/workflows/hall-wits-eval-core.yml
    with:
      plugin-sha: ${{ needs.gate.outputs.head-sha }}
    secrets: inherit

  finish:
    needs: [gate, pipeline]
    if: always() && needs.gate.outputs.triggered == 'true'
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
      checks: write
    steps:
      # A matrixed reusable-workflow job only exposes the LAST instance's
      # outputs via needs.*.outputs — each iteration's run-id is unrecoverable
      # that way. All 3 iterations still upload under the shared
      # `hall-wits-run-*` name prefix (random per-iteration suffix), so
      # pattern-matching sidesteps the matrix-outputs limitation entirely.
      - name: Checkout aggregate script from master
        uses: actions/checkout@v4
        with:
          ref: master

      - name: Download all iteration artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: hall-wits-run-*
          path: iterations
          if-no-files-found: warn

      - name: Aggregate iterations
        run: |
          python3 tests/hall-wits/aggregate.py iterations > aggregate-report.md

      - name: Post assessment comment
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh pr comment ${{ github.event.issue.number }} \
            --body-file aggregate-report.md --repo "$GITHUB_REPOSITORY"

      - name: Finish trigger + check run
        if: always()
        uses: MockaSort-Studio/actions/.github/actions/pr-comment-trigger/finish@993d2dda1e172fa1f06a7d218f32c4bd66303fde
        with:
          check-run-id: ${{ needs.gate.outputs.check-run-id }}
          status: ${{ needs.pipeline.result }}
          token: ${{ secrets.GITHUB_TOKEN }}
