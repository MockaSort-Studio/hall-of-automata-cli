name: Hall Wits — PR eval

on:
  issue_comment:
    types: [created]

jobs:
  gate:
    if: >
      github.event.issue.pull_request &&
      contains(fromJSON('["MEMBER","OWNER","COLLABORATOR"]'),
               github.event.comment.author_association)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      checks: write
    outputs:
      triggered: ${{ steps.trigger.outputs.triggered }}
      head-sha: ${{ steps.trigger.outputs.head-sha }}
      check-run-id: ${{ steps.trigger.outputs.check-run-id }}
    steps:
      - name: Start trigger + check run
        id: trigger
        uses: MockaSort-Studio/actions/.github/actions/pr-comment-trigger/start@993d2dda1e172fa1f06a7d218f32c4bd66303fde
        with:
          check-name: hall-wits-eval
          trigger-phrase: ":crystal_ball:|🔮"
          in-progress-title: "Hall Wits eval running"
          in-progress-summary: "Provisioning, running the golden task, checking, and judging…"
          ack-comment: ":crystal_ball: Popotron stirs... running the golden task."
          token: ${{ secrets.GITHUB_TOKEN }}

  pipeline:
    needs: gate
    if: needs.gate.outputs.triggered == 'true'
    uses: ./.github/workflows/hall-wits-eval-core.yml
    with:
      plugin-sha: ${{ needs.gate.outputs.head-sha }}
    secrets: inherit

  finish:
    needs: [gate, pipeline]
    if: always() && needs.gate.outputs.triggered == 'true'
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
      checks: write
    steps:
      - name: Download run artifact
        if: needs.pipeline.outputs.run-id != ''
        uses: actions/download-artifact@v4
        with:
          name: hall-wits-run-${{ needs.pipeline.outputs.run-id }}
          path: run

      # Structural checks are deterministic verification of what Old Major
      # actually did to real GitHub state — any failure is a real bug, and
      # must fail this check run, not just get reported informationally in
      # the PR comment as it did before.
      - name: Check structural gate
        id: gate-check
        if: needs.pipeline.outputs.run-id != ''
        run: |
          if grep -q '❌' run/checker-output.txt 2>/dev/null; then
            echo "passed=false" >> "$GITHUB_OUTPUT"
            echo "::error::Structural checks failed — see checker-output.txt in the run artifact"
          else
            echo "passed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Post assessment comment
        if: needs.pipeline.outputs.run-id != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh pr comment ${{ github.event.issue.number }} \
            --body-file run/report.md --repo "$GITHUB_REPOSITORY"

      - name: Finish trigger + check run
        if: always()
        uses: MockaSort-Studio/actions/.github/actions/pr-comment-trigger/finish@993d2dda1e172fa1f06a7d218f32c4bd66303fde
        with:
          check-run-id: ${{ needs.gate.outputs.check-run-id }}
          status: ${{ (needs.pipeline.result == 'success' && steps.gate-check.outputs.passed != 'false') && 'success' || 'failure' }}
          token: ${{ secrets.GITHUB_TOKEN }}
