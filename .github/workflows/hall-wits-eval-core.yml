name: Hall Wits — eval core

on:
  workflow_call:
    inputs:
      plugin-sha:
        description: SHA of the plugin code to test
        required: true
        type: string
    outputs:
      run-id:
        description: Run identifier for artifact lookup
        value: ${{ jobs.pipeline.outputs.run-id }}

jobs:
  pipeline:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      run-id: ${{ steps.run.outputs.run_id }}

    steps:
      - name: Checkout PR plugin code
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.plugin-sha }}
          path: pr-plugin

      - name: Checkout test harness from master
        uses: actions/checkout@v4
        with:
          ref: master
          path: scripts

      - name: Install Claude Code
        run: npm install -g @anthropic-ai/claude-code

      - name: Generate run ID
        id: run
        run: echo "run_id=run-$(openssl rand -hex 3)" >> "$GITHUB_OUTPUT"

      - name: Snapshot wiki baseline
        env:
          HALL_WITS_ARENA_TOKEN: ${{ secrets.HALL_WITS_ARENA_TOKEN }}
        run: |
          git clone \
            "https://x-access-token:${HALL_WITS_ARENA_TOKEN}@github.com/MockaSort-Studio/hall-wits-arena.wiki.git" \
            wiki-baseline

      # fixture_path is a path within hall-wits-arena resolved via the
      # GitHub Contents API — not a local checkout path.
      - name: Provision fixture
        env:
          HALL_WITS_ARENA_TOKEN: ${{ secrets.HALL_WITS_ARENA_TOKEN }}
        run: |
          mkdir -p run-dir
          python3 scripts/tests/hall-wits/provision.py \
            fixtures/golden-path-01 \
            ${{ steps.run.outputs.run_id }} \
            --out-dir "$GITHUB_WORKSPACE/run-dir"

      - name: Run eval — turns 1 and 2
        continue-on-error: true
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          HALL_WITS_ARENA_TOKEN: ${{ secrets.HALL_WITS_ARENA_TOKEN }}
        run: |
          python3 -u scripts/tests/hall-wits/runner.py \
            fixtures/golden-path-01 \
            "$GITHUB_WORKSPACE/run-dir" \
            --plugin-dir "$GITHUB_WORKSPACE/pr-plugin" \
            --cc-bin claude

      - name: Run state-model checker
        continue-on-error: true
        env:
          HALL_WITS_ARENA_TOKEN: ${{ secrets.HALL_WITS_ARENA_TOKEN }}
        run: |
          python3 scripts/tests/hall-wits/checker.py \
            "$GITHUB_WORKSPACE/run-dir" \
            scripts/tests/hall-wits/fixtures/golden-path-01-expected.json \
            2>&1 | tee checker-output.txt

      - name: Prepare Popotron judge
        id: judge-prep
        env:
          GH_TOKEN: ${{ secrets.HALL_WITS_ARENA_TOKEN }}
        run: |
          ARENA="repos/MockaSort-Studio/hall-wits-arena/contents"
          FIXTURE="fixtures/golden-path-01"
          RUN_DIR="$GITHUB_WORKSPACE/run-dir"

          # Persona goes straight into the prompt text — Popotron runs in an
          # isolated directory with no repo of its own, so there's no
          # CLAUDE.md to write it to in the first place.
          persona=$(gh api "$ARENA/judge/popotron.md" --jq '.content' | base64 -d)
          gh api "$ARENA/$FIXTURE/groundtruth/calibration.json" --jq '.content' \
            | base64 -d | jq '.' > "$RUN_DIR/calibration.json"
          gh api "$ARENA/$FIXTURE/task.json" --jq '.content' \
            | base64 -d | jq '.' > "$RUN_DIR/task.json"

          turn1=$(jq -rs '[.[] | select(.type=="assistant") | .message.content[]? | select(.type=="text") | .text] | join("\n\n")' \
            "$RUN_DIR/turn-1.jsonl" 2>/dev/null)
          [ -z "$turn1" ] && turn1="(empty)"
          turn2=$(jq -rs '[.[] | select(.type=="assistant") | .message.content[]? | select(.type=="text") | .text] | join("\n\n")' \
            "$RUN_DIR/turn-2.jsonl" 2>/dev/null)
          [ -z "$turn2" ] && turn2="(empty)"

          plan_text="(not produced)"
          [ -f "$RUN_DIR/eval-dispatch-plan.json" ] && plan_text=$(cat "$RUN_DIR/eval-dispatch-plan.json")

          {
            printf '%s\n\n---\n\n' "$persona"
            printf '## Fixture\n\n'
            jq '.' "$RUN_DIR/task.json"
            printf '\n## Groundtruth Calibration\n\n'
            jq '.' "$RUN_DIR/calibration.json"
            printf '\n## Turn 1 Transcript (assistant messages)\n\n'
            printf '%s' "$turn1"
            printf '\n\n## Turn 2 Transcript (assistant messages)\n\n'
            printf '%s' "$turn2"
            printf '\n\n## eval-dispatch-plan.json\n\n'
            printf '%s\n' "$plan_text"
          } > "$RUN_DIR/judge-prompt.txt"

      - name: Run Popotron judge
        id: popotron
        continue-on-error: true
        env:
          # Plain `claude` CLI, invoked the same way runner.py invokes it for
          # turns 1/2 — isolated cwd, no --plugin-dir, no repo checked out
          # here at all. anthropics/claude-code-action was doing its own
          # checkout-and-restore of hall-of-automata-cli's real repo at the
          # workspace root as part of its normal operation, which gave
          # Popotron ambient visibility into this repo's actual OKRs/KRs/
          # board and repeatedly pulled its judgment toward that real state
          # instead of the fixture's. A bare CLI call in a fresh directory
          # has nothing to "look into" besides the prompt it's given.
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          GH_TOKEN: ${{ secrets.HALL_WITS_ARENA_TOKEN }}
          HALL_WITS_ARENA_TOKEN: ${{ secrets.HALL_WITS_ARENA_TOKEN }}
        run: |
          RUN_DIR="$GITHUB_WORKSPACE/run-dir"
          JUDGE_DIR=$(mktemp -d)
          cd "$JUDGE_DIR"
          claude --print "$(cat "$RUN_DIR/judge-prompt.txt")" \
            --output-format json \
            --model claude-opus-5 \
            --dangerously-skip-permissions \
            --json-schema '{"type":"object","properties":{"dimensions":{"type":"array","items":{"type":"object","properties":{"id":{"type":"string"},"score":{"type":"integer"},"justification":{"type":"string"},"derivation":{"type":"string"}},"required":["id","score","justification","derivation"]}}},"required":["dimensions"]}' \
            > "$RUN_DIR/popotron-raw.json"

          {
            echo 'structured_output<<POPOTRON_SCORES_EOF'
            jq -c '.structured_output // {}' "$RUN_DIR/popotron-raw.json"
            echo 'POPOTRON_SCORES_EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Collect Popotron scores
        continue-on-error: true
        env:
          JUDGE_STRUCTURED_OUTPUT: ${{ steps.popotron.outputs.structured_output }}
        run: |
          python3 scripts/tests/hall-wits/judge-scores.py \
            "$GITHUB_WORKSPACE/run-dir" \
            --judge-model claude-opus-5 \
            --test-model claude-sonnet-4-6 \
            2>&1 | tee judge-output.txt

      - name: Generate report
        if: always() && steps.run.outputs.run_id != ''
        run: |
          python3 scripts/tests/hall-wits/report.py \
            "$GITHUB_WORKSPACE/run-dir" \
            --checker-out checker-output.txt \
            --run-url "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
            > report.md

      - name: Snapshot GitHub artifacts
        if: always() && steps.run.outputs.run_id != ''
        env:
          HALL_WITS_ARENA_TOKEN: ${{ secrets.HALL_WITS_ARENA_TOKEN }}
        run: |
          python3 scripts/tests/hall-wits/snapshot.py \
            ${{ steps.run.outputs.run_id }} \
            "$GITHUB_WORKSPACE/run-dir" \
            --project-number 9

      - name: Upload run artifacts
        if: always() && steps.run.outputs.run_id != ''
        uses: actions/upload-artifact@v4
        with:
          name: hall-wits-run-${{ steps.run.outputs.run_id }}
          path: |
            run-dir/
            checker-output.txt
            judge-output.txt
            report.md
          if-no-files-found: warn

      - name: Close run-tagged issues
        if: always() && steps.run.outputs.run_id != ''
        env:
          HALL_WITS_ARENA_TOKEN: ${{ secrets.HALL_WITS_ARENA_TOKEN }}
        run: |
          python3 scripts/tests/hall-wits/cleanup.py ${{ steps.run.outputs.run_id }} \
            "$GITHUB_WORKSPACE/run-dir"

      - name: Verify zero orphans
        if: always() && steps.run.outputs.run_id != ''
        id: verify-orphans
        env:
          HALL_WITS_ARENA_TOKEN: ${{ secrets.HALL_WITS_ARENA_TOKEN }}
        run: |
          python3 scripts/tests/hall-wits/cleanup.py ${{ steps.run.outputs.run_id }} \
            "$GITHUB_WORKSPACE/run-dir" --dry-run

      - name: Delete run label
        # Only after orphan verification — deleting first strips the label from
        # any missed issue, making the verify step permanently blind.
        if: always() && steps.run.outputs.run_id != '' && steps.verify-orphans.outcome == 'success'
        env:
          HALL_WITS_ARENA_TOKEN: ${{ secrets.HALL_WITS_ARENA_TOKEN }}
        run: |
          python3 scripts/tests/hall-wits/cleanup.py ${{ steps.run.outputs.run_id }} --delete-label

      - name: Reset wiki to baseline
        if: always() && steps.run.outputs.run_id != ''
        env:
          HALL_WITS_ARENA_TOKEN: ${{ secrets.HALL_WITS_ARENA_TOKEN }}
        run: |
          if [ -d wiki-baseline/.git ]; then
            baseline=$(git -C wiki-baseline rev-parse HEAD)
            git clone \
              "https://x-access-token:${HALL_WITS_ARENA_TOKEN}@github.com/MockaSort-Studio/hall-wits-arena.wiki.git" \
              wiki-current
            git -C wiki-current reset --hard "$baseline"
            git -C wiki-current push --force origin HEAD
          else
            echo "::error::wiki baseline was never captured — cannot verify a clean reset"
            exit 1
          fi
