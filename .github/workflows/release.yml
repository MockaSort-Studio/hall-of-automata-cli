name: Release

on:
  push:
    branches: [master]
    paths: ['.claude-plugin/plugin.json']

jobs:
  check-version:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      version: ${{ steps.parse.outputs.version }}
      changed: ${{ steps.tag-check.outputs.changed }}
    steps:
      - uses: actions/checkout@v4

      - name: Parse version from plugin.json
        id: parse
        run: |
          version=$(jq -r '.version' .claude-plugin/plugin.json)
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Check whether tag already exists
        id: tag-check
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.parse.outputs.version }}
        run: |
          if gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/v${VERSION}" > /dev/null 2>&1; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

  eval:
    needs: check-version
    if: needs.check-version.outputs.changed == 'true'
    strategy:
      fail-fast: false
      matrix:
        iteration: [1, 2, 3]
    uses: ./.github/workflows/hall-wits-eval-core.yml
    with:
      plugin-sha: ${{ github.sha }}
    secrets: inherit

  release:
    needs: [check-version, eval]
    if: needs.check-version.outputs.changed == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # A matrixed reusable-workflow job only exposes the LAST instance's
      # outputs via needs.*.outputs, so run-id can't be read directly —
      # download by the shared hall-wits-run-* name prefix instead.
      - uses: actions/checkout@v4

      - name: Download all iteration artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: hall-wits-run-*
          path: iterations
          if-no-files-found: warn

      - name: Aggregate iterations
        run: |
          python3 tests/hall-wits/aggregate.py iterations > aggregate-report.md

      - name: Verify eval verdict
        run: |
          python3 tests/hall-wits/aggregate.py iterations --verdict

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.check-version.outputs.version }}
        run: |
          gh release create "v${VERSION}" \
            --title "v${VERSION}" \
            --target "${{ github.sha }}" \
            --notes-file aggregate-report.md \
            --repo "$GITHUB_REPOSITORY"
