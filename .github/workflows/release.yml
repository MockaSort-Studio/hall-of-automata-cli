name: Release

on:
  push:
    branches: [master]
    paths: ['.claude-plugin/plugin.json']

jobs:
  check-version:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      version: ${{ steps.parse.outputs.version }}
      changed: ${{ steps.tag-check.outputs.changed }}
    steps:
      - uses: actions/checkout@v4

      - name: Parse version from plugin.json
        id: parse
        run: |
          version=$(jq -r '.version' .claude-plugin/plugin.json)
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Check whether tag already exists
        id: tag-check
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.parse.outputs.version }}
        run: |
          if gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/v${VERSION}" > /dev/null 2>&1; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

  eval:
    needs: check-version
    if: needs.check-version.outputs.changed == 'true'
    uses: ./.github/workflows/hall-wits-eval-core.yml
    with:
      plugin-sha: ${{ github.sha }}
    secrets: inherit

  release:
    needs: [check-version, eval]
    if: needs.check-version.outputs.changed == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download run artifact
        if: needs.eval.outputs.run-id != ''
        uses: actions/download-artifact@v4
        with:
          name: hall-wits-run-${{ needs.eval.outputs.run-id }}
          path: run

      # Structural checks and judge calibration are the release gate —
      # any structural failure, or a calibration mismatch, blocks the
      # release outright. No separate verdict script for a single run;
      # this is the whole gate.
      - name: Verify eval verdict
        run: |
          if [ ! -f run/checker-output.txt ]; then
            echo "::error::no eval run artifact found — cannot verify release gate"
            exit 1
          fi
          if grep -q '❌' run/checker-output.txt; then
            echo "::error::structural checks failed — see checker-output.txt"
            exit 1
          fi
          if [ ! -f run/run-dir/judge-scores.json ] || \
             [ "$(jq -r '.calibration_agreement' run/run-dir/judge-scores.json)" != "true" ]; then
            echo "::error::judge calibration mismatch — see judge-scores.json"
            exit 1
          fi

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.check-version.outputs.version }}
        run: |
          gh release create "v${VERSION}" \
            --title "v${VERSION}" \
            --target "${{ github.sha }}" \
            --notes-file run/report.md \
            --repo "$GITHUB_REPOSITORY"
