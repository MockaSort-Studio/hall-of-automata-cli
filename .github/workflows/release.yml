name: Release

on:
  push:
    branches: [master]
    paths: ['.claude-plugin/plugin.json']

jobs:
  check-version:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      version: ${{ steps.parse.outputs.version }}
      changed: ${{ steps.tag-check.outputs.changed }}
    steps:
      - uses: actions/checkout@v4

      - name: Parse version from plugin.json
        id: parse
        run: |
          version=$(jq -r '.version' .claude-plugin/plugin.json)
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Check whether tag already exists
        id: tag-check
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.parse.outputs.version }}
        run: |
          if gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/v${VERSION}" > /dev/null 2>&1; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

  release:
    needs: check-version
    if: needs.check-version.outputs.changed == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.check-version.outputs.version }}
        run: |
          gh release create "v${VERSION}" \
            --title "v${VERSION}" \
            --target "${{ github.sha }}" \
            --generate-notes \
            --repo "$GITHUB_REPOSITORY"

  marketplace:
    needs: [check-version, release]
    if: needs.check-version.outputs.changed == 'true'
    uses: ./.github/workflows/marketplace-sync.yml
    with:
      tag: v${{ needs.check-version.outputs.version }}
    secrets:
      marketplace_token: ${{ secrets.MARKETPLACE_PUSH_TOKEN }}
